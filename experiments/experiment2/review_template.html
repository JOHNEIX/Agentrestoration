<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>修复结果内容复核</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#25334a;font:15px/1.6 system-ui}
main{max-width:1450px;margin:24px auto;padding:0 22px}h1{font-size:25px;margin:0}
.hint{color:#66778f;margin:8px 0 18px}.toolbar,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar{justify-content:space-between;margin-bottom:18px}.counter{font-weight:600}
button,select,textarea{font:inherit;border:1px solid #d6deea;border-radius:8px;padding:8px 12px;background:white;color:inherit}
button{cursor:pointer}button.primary{background:#2878e3;color:white;border-color:#2878e3}
button:disabled{opacity:.4;cursor:default}.pictures{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
figure{margin:0;background:white;border:1px solid #e1e7ef;border-radius:12px;padding:12px}
figcaption{font-weight:600;margin-bottom:8px}img{width:100%;height:365px;object-fit:contain;background:#f8fafc;border-radius:7px}
.form{background:white;border:1px solid #e1e7ef;border-radius:12px;padding:18px;margin:18px 0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:20px}label{display:block;font-weight:600}select,textarea{width:100%;margin-top:6px}
textarea{min-height:84px;resize:vertical}.notes{margin-top:12px}#notice{color:#64748b;margin-top:8px}
@media(max-width:800px){.pictures{grid-template-columns:1fr}img{height:300px}.fields{grid-template-columns:1fr}}
</style></head>
<body><main>
<h1>修复结果内容复核</h1>
<p class="hint">对照退化输入和干净参考，检查候选是否出现物体增删、变形、异常色块或背景变化。正常去噪、纹理平滑与细节锐化按实际效果判断。页面不显示处理方法。</p>
<div class="toolbar"><span class="counter" id="counter"></span><div class="actions">
<button id="load">导入标注</button><input id="file" type="file" accept=".json" hidden>
<button class="primary" id="export">导出标注 JSON</button></div></div>
<div class="pictures">
<figure><figcaption>退化输入</figcaption><a id="input-link" target="_blank"><img id="input" alt="退化输入"></a></figure>
<figure><figcaption>干净参考</figcaption><a id="reference-link" target="_blank"><img id="reference" alt="干净参考"></a></figure>
<figure><figcaption id="candidate-title">候选</figcaption><a id="candidate-link" target="_blank"><img id="candidate" alt="候选"></a></figure>
</div>
<div class="form"><div class="fields">
<label>是否存在内容错误<select id="content_error">
<option value="pending">待复核</option><option value="no">没有明显内容错误</option>
<option value="yes">存在内容错误</option><option value="uncertain">无法确认</option></select></label>
<label>相对退化输入的修复质量<select id="quality">
<option value="pending">待复核</option><option value="improved">改善</option><option value="unchanged">无明显变化</option>
<option value="worse">变差</option><option value="uncertain">无法确认</option></select></label>
</div><label class="notes">备注：对象、区域和理由<textarea id="notes" placeholder="例如：右侧雕像轮廓改变；天空出现紫色色块"></textarea></label>
<div id="notice">标注保存在本浏览器中；完成后点击“导出标注 JSON”。点击图片可查看原尺寸。</div></div>
<div class="toolbar"><div class="actions"><button id="previous">上一张</button><button id="next">下一张</button>
<button id="pending">跳到待复核</button></div><span id="saved"></span></div>
</main>
<script>
const data=__REVIEW_DATA__;
const key="agentrestoration-content-review:"+data.run_id;
const byId=Object.fromEntries(data.samples.map(s=>[s.sample_id,s]));
let position=0,labels={...data.labels};
try{Object.assign(labels,JSON.parse(localStorage.getItem(key)||"{}"));}catch(e){}
const $=id=>document.getElementById(id);
function current(){return data.samples[position];}
function labelFor(s){return labels[s.sample_id]||{sample_id:s.sample_id,output_sha256:s.output_sha256,content_error:"pending",quality:"pending",notes:""};}
function counts(){const n=data.samples.filter(s=>labelFor(s).content_error!=="pending").length;$("saved").textContent="内容已复核 "+n+" / "+data.samples.length;}
function render(){
 const s=current(),label=labelFor(s);
 $("counter").textContent=s.sample_id+" · "+(position+1)+" / "+data.samples.length;
 $("candidate-title").textContent="候选 "+s.sample_id;
 for(const name of ["input","reference","candidate"]){$(name).src=s[name];$(name+"-link").href=s[name];}
 for(const field of ["content_error","quality","notes"]){$(field).value=label[field]||"";}
 $("previous").disabled=position===0;$("next").disabled=position===data.samples.length-1;counts();
}
function save(){
 const s=current();labels[s.sample_id]={sample_id:s.sample_id,output_sha256:s.output_sha256,
 content_error:$("content_error").value,quality:$("quality").value,notes:$("notes").value};
 try{localStorage.setItem(key,JSON.stringify(labels));$("notice").textContent="已保存到本浏览器；导出 JSON 后可汇总。";}
 catch(e){$("notice").textContent="浏览器未保存，请及时导出 JSON。";}
 counts();
}
for(const field of ["content_error","quality","notes"]){$(field).addEventListener("change",save);}
$("notes").addEventListener("input",save);
$("previous").onclick=()=>{save();position--;render();};
$("next").onclick=()=>{save();position++;render();};
$("pending").onclick=()=>{save();for(let n=1;n<=data.samples.length;n++){const i=(position+n)%data.samples.length;
 if(labelFor(data.samples[i]).content_error==="pending"){position=i;render();return;}}};
$("export").onclick=()=>{save();const payload={run_id:data.run_id,labels:data.samples.map(s=>labelFor(s))};
 const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}));
 const a=document.createElement("a");a.href=url;a.download="content_review_labels.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$("load").onclick=()=>$("file").click();
$("file").onchange=async()=>{
 try{const payload=JSON.parse(await $("file").files[0].text());if(payload.run_id!==data.run_id)throw Error("实验编号不一致");
 const incoming={};for(const label of payload.labels){const sample=byId[label.sample_id];
 if(!sample||sample.output_sha256!==label.output_sha256||incoming[label.sample_id])throw Error("图片编号或哈希不一致");
 if(!["pending","yes","no","uncertain"].includes(label.content_error)||
 !["pending","improved","unchanged","worse","uncertain"].includes(label.quality)||typeof label.notes!=="string")throw Error("标签格式错误");
 incoming[label.sample_id]=label;}Object.assign(labels,incoming);localStorage.setItem(key,JSON.stringify(labels));render();
 $("notice").textContent="已导入标注。";}catch(error){$("notice").textContent="导入失败："+error.message;}
};
render();
</script></body></html>
