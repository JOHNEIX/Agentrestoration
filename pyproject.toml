[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentrestoration"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "Pillow", "numpy", "httpx", "ultralytics", "einops", "truststore"]

[project.optional-dependencies]
experiments = ["scikit-image", "matplotlib", "lpips==0.1.4"]
dev = ["pytest"]
ui = ["streamlit>=1.67,<2"]

[project.scripts]
agentrestoration = "agentrestoration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "experiments/experiment2"]
