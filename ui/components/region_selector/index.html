<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
body{margin:0;font:13px system-ui;color:#53647b}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
button{padding:5px 10px;background:white;border:1px solid #cbd5e1;border-radius:6px;color:#334155;cursor:pointer}
.canvas-stage{height:380px;display:grid;place-items:center;background:#f7f9fc;border-radius:10px}
canvas{display:block;width:auto;height:auto;max-width:100%;max-height:380px;border-radius:9px;touch-action:none;cursor:crosshair}
#status{margin:8px 0;min-height:20px}
</style></head><body>
<div class="canvas-stage"><canvas id="canvas" aria-label="框选修复区域"></canvas></div>
<div class="bar"><span>框住所需要修改的部分</span><button id="clear" type="button">清除选区</button></div>
<div id="status" role="status">请框选一个矩形区域</div>
<script>
const canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d");
const clear=document.getElementById("clear"),status=document.getElementById("status");
let args={}, image=null, selection=null, anchor=null, imageId=null, imageUrl=null;
function send(type, values={}) {
  window.parent.postMessage({isStreamlitMessage:true,type,...values},"*");
}
function height(){send("streamlit:setFrameHeight",{height:Math.ceil(document.body.getBoundingClientRect().height)+4});}
function draw() {
  if(!image)return;
  ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0);
  if(selection){
    const {x0,y0,x1,y1}=selection;
    ctx.fillStyle="rgba(239,68,68,.12)";ctx.strokeStyle="#ef4444";
    ctx.lineWidth=Math.max(2,canvas.width/200);
    ctx.fillRect(x0*canvas.width,y0*canvas.height,(x1-x0)*canvas.width,(y1-y0)*canvas.height);
    ctx.strokeRect(x0*canvas.width,y0*canvas.height,(x1-x0)*canvas.width,(y1-y0)*canvas.height);
  }
  status.textContent=selection?"已选中修复区域；框外内容保持原样":"请框选一个矩形区域";
  height();
}
function point(e) {
  const rect=canvas.getBoundingClientRect();
  return [Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width)),
          Math.max(0,Math.min(1,(e.clientY-rect.top)/rect.height))];
}
function rectangle(a,b){return {x0:Math.min(a[0],b[0]),y0:Math.min(a[1],b[1]),x1:Math.max(a[0],b[0]),y1:Math.max(a[1],b[1])};}
function publish(){send("streamlit:setComponentValue",{value:{image_id:imageId,region:selection},dataType:"json"});}
canvas.addEventListener("pointerdown",e=>{
  if(args.disabled||!image)return;
  anchor=point(e);canvas.setPointerCapture(e.pointerId);e.preventDefault();
});
canvas.addEventListener("pointermove",e=>{
  if(!anchor)return;
  selection=rectangle(anchor,point(e));draw();
});
canvas.addEventListener("pointerup",e=>{
  if(!anchor)return;
  selection=rectangle(anchor,point(e));anchor=null;
  if((selection.x1-selection.x0)*canvas.clientWidth<2||(selection.y1-selection.y0)*canvas.clientHeight<2)selection=null;
  draw();publish();
});
canvas.addEventListener("pointercancel",()=>{anchor=null;selection=args.region||null;draw();});
clear.addEventListener("click",()=>{if(args.disabled)return;selection=null;anchor=null;draw();publish();});
window.addEventListener("message",e=>{
  if(e.source!==window.parent||e.data.type!=="streamlit:render")return;
  args=e.data.args;imageId=args.image_id;selection=args.region||null;
  clear.disabled=Boolean(args.disabled);canvas.style.cursor=args.disabled?"default":"crosshair";
  if(imageUrl!==args.image){
    imageUrl=args.image;anchor=null;const next=new Image();
    next.onload=()=>{if(imageUrl!==next.src)return;image=next;canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;draw();};
    next.src=imageUrl;
  }else draw();
});
new ResizeObserver(height).observe(document.body);
send("streamlit:componentReady",{apiVersion:1});height();
</script></body></html>
